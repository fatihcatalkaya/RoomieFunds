services:
  db:
    image: postgres:17.3-alpine3.20
    ports:
      - "5432:5432"
    volumes:
      - roomiefunds-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DATABASE: app

  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "8081:8080"
    environment:
      - DBHUB_LOG_LEVEL=info
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - "postgres://app:app@db:5432/app"
    depends_on:
      - db

volumes:
  roomiefunds-db:
