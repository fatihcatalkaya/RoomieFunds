name: ci.yml
on:
  push:
    tags:
      - '\d+\.\d+\.\d+'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/main/frontend/dist
  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    services:
      docker:
        image: docker:24.0.7-dind
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/main/frontend/dist
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: "maven"
      - name: Run Maven package with jooq profile
        run: mvn package -P jooq
        working-directory: ${{ github.workspace }}
      - name: Build Docker image
        run: |
          TAG=${GITHUB_REF##*/}
          docker build -f src/main/docker/Dockerfile.jvm -t ghcr.io/fatihcatalkaya/roomiefunds:$TAG .
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: |
          TAG=${GITHUB_REF##*/}
          docker push ghcr.io/fatihcatalkaya/roomiefunds:$TAG
